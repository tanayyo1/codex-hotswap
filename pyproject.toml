[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-hotswap"
version = "0.1.0"
description = "Rotate Codex launch targets and resume the latest session after rate-limit style failures."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Tanay", email = "tanayy07@gmail.com" }
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
codex-hotswap = "codex_hotswap.cli:main"
codex-hot = "codex_hotswap.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

